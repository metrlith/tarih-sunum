<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Giriş Yap</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #87ceeb 0%, #fbaf98 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-box {
            background: rgba(255,255,255,0.95);
            padding: 40px 48px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.18);
            min-width: 320px;
            text-align: center;
        }
        .login-box h2 {
            margin-bottom: 18px;
            color: #2c3e50;
            font-size: 26px;
            font-weight: bold;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 18px 0 24px 0;
            border-radius: 8px;
            border: 1px solid #b0c4de;
            font-size: 16px;
            background: #f8fafd;
            transition: border 0.2s;
        }
        input[type="password"]:focus {
            border: 1.5px solid #87ceeb;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(90deg, #2c3e50 60%, #87ceeb 100%);
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }
        button:hover {
            background: linear-gradient(90deg, #1a1a1a 60%, #98fb98 100%);
            transform: scale(1.03);
        }
    </style>
</head>
<body>
    <form class="login-box" method="POST" action="/login">
        <h2>Şifre ile Giriş</h2>
        <input type="password" name="password" placeholder="Şifre" required>
        <button type="submit">Giriş Yapın</button>
    </form>
</body>
</html>
